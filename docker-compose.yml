version: '3.9'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - HF_REPO_ID=${HF_REPO_ID}
      - HF_TOKEN=${HF_TOKEN}
      - CITATIONHUB_DATA_DIR=${CITATIONHUB_DATA_DIR:-/tmp/citationhub_data}
    volumes:
      - citationhub_cache:/root/.cache/huggingface

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  citationhub_cache:
